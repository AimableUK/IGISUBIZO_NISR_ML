name: Web
on:
  # push:
  #  branches: [main]
  #  paths: ["web/**", ".github/workflows/web.yml"]
  # pull_request:
  #  paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:
    
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.2
      - run: pnpm install --lockfile=false
      - run: pnpm run typecheck
      - run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
      - run: docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000 -t mboni-web:${{ github.sha }} .
