<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mboni eye states</title>
  <style>
    body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #f4f7f5; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .card { border-radius: 14px; padding: 16px; background: #fff; }
    .card.dark { background: #0B1410; color: #cfe9dc; }
    .row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; margin-bottom: 12px; }
    .eye { width: 240px; margin: 0 auto; }
    button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 8px; border: 1px solid #9bb8a8; background: transparent; color: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <!-- Serve over HTTP (e.g. npx serve .. ) because the SVGs are fetched and inlined. Paths assume this file is in html/. -->
  <div class="grid" id="grid"></div>
  <script>
    const states = [
      ["01 static", "mboni-eye.svg"], ["02 thinking", "mboni-eye-thinking.svg"], ["03 scanning", "mboni-eye-scanning.svg"],
      ["04 activate", "mboni-eye-activate.svg"], ["05 processing", "mboni-eye-processing.svg"], ["06 attentive", "mboni-eye-attentive.svg"],
    ];
    const grid = document.getElementById("grid");
    for (const theme of ["light", "dark"]) {
      for (const [label, file] of states) {
        const card = document.createElement("div");
        card.className = "card " + theme;
        card.innerHTML = `<div class="row"><b>${label}</b><button>replay</button></div><div class="eye"></div>`;
        grid.appendChild(card);
        const box = card.querySelector(".eye");
        const load = async () => {
          const svg = await (await fetch("../svg/" + file)).text();
          box.innerHTML = svg;
          const el = box.firstElementChild;
          el.setAttribute("data-theme", theme);
          el.removeAttribute("height"); el.setAttribute("width", "100%");
        };
        card.querySelector("button").onclick = load;
        load();
      }
    }
  </script>
</body>
</html>
