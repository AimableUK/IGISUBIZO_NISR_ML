<svg xmlns="http://www.w3.org/2000/svg" class="mboni mboni-attend" viewBox="0 0 240 88" width="240" height="88" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mboni-at-title" data-theme="auto">
  <title id="mboni-at-title">Mboni attentive</title>
  <style>
    .mboni-attend{--mb-dur:var(--mboni-dur,6s);--mb-delay:var(--mboni-delay,0s);--mb-count:var(--mboni-count,infinite);--mb-enter:var(--mboni-enter,.7s);--mb-lid:var(--mboni-lid,#0B5D3B);--mb-iris:var(--mboni-iris,#0F8A5F);--mb-pupil:var(--mboni-pupil,#052E1F);--mb-arc:var(--mboni-arc,#A7F3D0);--mb-hl:var(--mboni-hl,#F0FFF7);}
    @media (prefers-color-scheme:dark){.mboni-attend{--mb-lid:var(--mboni-lid,#34D399);--mb-iris:var(--mboni-iris,#10B981);--mb-pupil:var(--mboni-pupil,#022C22);--mb-arc:var(--mboni-arc,#D9F99D);--mb-hl:var(--mboni-hl,#ECFDF5);}}
    .mboni-attend[data-theme="light"]{--mb-lid:var(--mboni-lid,#0B5D3B);--mb-iris:var(--mboni-iris,#0F8A5F);--mb-pupil:var(--mboni-pupil,#052E1F);--mb-arc:var(--mboni-arc,#A7F3D0);--mb-hl:var(--mboni-hl,#F0FFF7);}
    .mboni-attend[data-theme="dark"]{--mb-lid:var(--mboni-lid,#34D399);--mb-iris:var(--mboni-iris,#10B981);--mb-pupil:var(--mboni-pupil,#022C22);--mb-arc:var(--mboni-arc,#D9F99D);--mb-hl:var(--mboni-hl,#ECFDF5);}
    .mbr-lid{fill:var(--mb-lid)}.mbr-iris{fill:var(--mb-iris)}.mbr-pupil{fill:var(--mb-pupil)}.mbr-hl{fill:var(--mb-hl)}
    .mbr-arc{fill:none;stroke:var(--mb-arc);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:100 100;stroke-dashoffset:0}
    .mbr-blink,.mbr-squash,.mbr-lid-top,.mbr-lid-bot{transform-box:view-box;transform-origin:120px 50px}
    .mbr-zoom,.mbr-pupil-g{transform-box:view-box;transform-origin:120px 46px}
    .mbr-hl1{transform-box:view-box;transform-origin:111px 38px}
    .mbr-hl2{transform-box:view-box;transform-origin:127px 55px}
    .mbr-lid-top{animation:mbr-top-in var(--mb-enter) cubic-bezier(.3,.7,.3,1) var(--mb-delay) 1 forwards}
    .mbr-lid-bot{animation:mbr-bot-in var(--mb-enter) cubic-bezier(.3,.7,.3,1) var(--mb-delay) 1 forwards}
    .mbr-zoom{animation:mbr-zoom-in var(--mb-enter) cubic-bezier(.3,.7,.3,1) var(--mb-delay) 1 forwards}
    .mbr-hl1{animation:mbr-hl-in var(--mb-enter) cubic-bezier(.3,.7,.3,1) var(--mb-delay) 1 forwards}
    .mbr-pupil-g{animation:mbr-pupil-in var(--mb-enter) ease-out var(--mb-delay) 1 forwards,mbr-pupil var(--mb-dur) ease-in-out calc(var(--mb-delay) + var(--mb-enter)) var(--mb-count) forwards}
    .mbr-blink{animation:mbr-blink var(--mb-dur) ease-in-out calc(var(--mb-delay) + var(--mb-enter)) var(--mb-count) both}
    @keyframes mbr-top-in{from{transform:scaleY(1)}to{transform:scaleY(1.1)}}
    @keyframes mbr-bot-in{from{transform:scaleY(1)}to{transform:scaleY(1.04)}}
    @keyframes mbr-zoom-in{from{transform:scale(1)}to{transform:scale(1.05)}}
    @keyframes mbr-hl-in{from{transform:scale(1)}to{transform:scale(1.12)}}
    @keyframes mbr-pupil-in{from{transform:scale(1)}to{transform:scale(1.1)}}
    @keyframes mbr-pupil{0%,100%{transform:scale(1.1)}50%{transform:scale(1.07)}}
    @keyframes mbr-blink{0%,78%{transform:scaleY(1);animation-timing-function:ease-in}80%{transform:scaleY(.06);animation-timing-function:ease-out}84%,100%{transform:scaleY(1)}}
    @media (prefers-reduced-motion:reduce){.mboni-attend *{animation:none!important}}
    .mboni-attend[data-motion="off"] *{animation:none!important}
  </style>
  <defs>
    <!-- Canonical eye opening (identical in every Mboni asset) -->
    <clipPath id="mboni-at-open"><path d="M10 54 C54 7 182 2 230 46 C184 86 58 82 10 54 Z"/></clipPath>
  </defs>
  <g class="mbr-blink">
    <g clip-path="url(#mboni-at-open)">
      <g class="mbr-squash"><g class="mbr-gaze"><g class="mbr-zoom">
        <!-- iris -->
        <path class="mbr-iris" d="M94 46 a26 26 0 1 0 52 0 a26 26 0 1 0 -52 0 Z"/>
        <!-- limbal light arc -->
        <path class="mbr-arc" pathLength="100" d="M140.28 51.43 A21 21 0 0 1 114.57 66.28"/>
        <!-- pupil -->
        <g class="mbr-pupil-g"><path class="mbr-pupil" d="M109 46 a11 11 0 1 0 22 0 a11 11 0 1 0 -22 0 Z"/></g>
        <!-- highlights -->
        <g class="mbr-hlg">
          <g class="mbr-hl1"><path class="mbr-hl" d="M106.8 38 a4.2 4.2 0 1 0 8.4 0 a4.2 4.2 0 1 0 -8.4 0 Z"/></g>
          <g class="mbr-hl2"><path class="mbr-hl" d="M125.3 55 a1.7 1.7 0 1 0 3.4 0 a1.7 1.7 0 1 0 -3.4 0 Z"/></g>
        </g>
      </g></g></g>
    </g>
    <!-- upper lid -->
    <path class="mbr-lid mbr-lid-top" d="M10 54 C54 -4 182 -8 230 46 C182 2 54 7 10 54 Z"/>
    <!-- lower lid -->
    <path class="mbr-lid mbr-lid-bot" d="M10 54 C58 88 184 92 230 46 C184 86 58 82 10 54 Z"/>
  </g>
</svg>
