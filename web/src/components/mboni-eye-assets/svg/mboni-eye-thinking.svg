<svg xmlns="http://www.w3.org/2000/svg" class="mboni mboni-think" viewBox="0 0 240 88" width="240" height="88" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mboni-th-title" data-theme="auto">
  <title id="mboni-th-title">Mboni thinking</title>
  <style>
    /* ---------- Tokens (override any --mboni-* var from a parent element) ---------- */
    .mboni-think {
      --mb-dur: var(--mboni-dur, 5.2s);              /* one full thinking loop */
      --mb-delay: var(--mboni-delay, 0s);            /* start delay */
      --mb-count: var(--mboni-count, infinite);      /* loop count */
      --mb-lid: var(--mboni-lid, #0B5D3B);
      --mb-iris: var(--mboni-iris, #0F8A5F);
      --mb-pupil: var(--mboni-pupil, #052E1F);
      --mb-arc: var(--mboni-arc, #A7F3D0);
      --mb-hl: var(--mboni-hl, #F0FFF7);
    }
    @media (prefers-color-scheme: dark) {
      .mboni-think {
        --mb-lid: var(--mboni-lid, #34D399);
        --mb-iris: var(--mboni-iris, #10B981);
        --mb-pupil: var(--mboni-pupil, #022C22);
        --mb-arc: var(--mboni-arc, #D9F99D);
        --mb-hl: var(--mboni-hl, #ECFDF5);
      }
    }
    .mboni-think[data-theme="light"] {
      --mb-lid: var(--mboni-lid, #0B5D3B);
      --mb-iris: var(--mboni-iris, #0F8A5F);
      --mb-pupil: var(--mboni-pupil, #052E1F);
      --mb-arc: var(--mboni-arc, #A7F3D0);
      --mb-hl: var(--mboni-hl, #F0FFF7);
    }
    .mboni-think[data-theme="dark"] {
      --mb-lid: var(--mboni-lid, #34D399);
      --mb-iris: var(--mboni-iris, #10B981);
      --mb-pupil: var(--mboni-pupil, #022C22);
      --mb-arc: var(--mboni-arc, #D9F99D);
      --mb-hl: var(--mboni-hl, #ECFDF5);
    }

    /* ---------- Paint (base styles = canonical logo) ---------- */
    .mbt-lid   { fill: var(--mb-lid); }
    .mbt-iris  { fill: var(--mb-iris); }
    .mbt-pupil { fill: var(--mb-pupil); }
    .mbt-hl    { fill: var(--mb-hl); }
    .mbt-arc   { fill: none; stroke: var(--mb-arc); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 100 100; stroke-dashoffset: 0; }

    /* ---------- Transform origins (user units) ---------- */
    .mbt-blink, .mbt-lid-top, .mbt-lid-bot { transform-box: view-box; transform-origin: 120px 50px; }
    .mbt-pupil-g { transform-box: view-box; transform-origin: 120px 46px; }
    .mbt-hl1 { transform-box: view-box; transform-origin: 111px 38px; }

    /* ---------- Timeline: one loop = --mb-dur ---------- */
    .mbt-blink, .mbt-gaze, .mbt-lid-top, .mbt-lid-bot, .mbt-pupil-g, .mbt-arc, .mbt-hlg, .mbt-hl1 {
      animation-duration: var(--mb-dur);
      animation-delay: var(--mb-delay);
      animation-iteration-count: var(--mb-count);
      animation-fill-mode: both;
      animation-timing-function: cubic-bezier(.45, .05, .25, 1);
    }
    .mbt-blink   { animation-name: mbt-blink; }
    .mbt-gaze    { animation-name: mbt-gaze; }
    .mbt-hlg     { animation-name: mbt-hlg; }
    .mbt-lid-top { animation-name: mbt-squint-top; }
    .mbt-lid-bot { animation-name: mbt-squint-bot; }
    .mbt-pupil-g { animation-name: mbt-pupil; animation-timing-function: ease-in-out; }
    .mbt-arc     { animation-name: mbt-arc;   animation-timing-function: ease-in-out; }
    .mbt-hl1     { animation-name: mbt-hl1;   animation-timing-function: ease-in-out; }

    /* gaze: centre -> up-left glance -> drift -> up-right (blink mid-shift) -> hold -> back to centre */
    @keyframes mbt-gaze {
      0%, 10% { transform: translate(0, 0); }
      22%     { transform: translate(-9px, -4px); }
      46%     { transform: translate(-7px, -5px); }
      58%     { transform: translate(7px, -4px); }
      72%     { transform: translate(8px, -4px); }
      86%, 100% { transform: translate(0, 0); }
    }
    /* highlights counter-drift (light source stays put, adds depth) */
    @keyframes mbt-hlg {
      0%, 10% { transform: translate(0, 0); }
      22%     { transform: translate(2.7px, 1.2px); }
      46%     { transform: translate(2.1px, 1.5px); }
      58%     { transform: translate(-2.1px, 1.2px); }
      72%     { transform: translate(-2.4px, 1.2px); }
      86%, 100% { transform: translate(0, 0); }
    }
    /* lids lower slightly while thinking (focus), upper more than lower */
    @keyframes mbt-squint-top { 0%, 10% { transform: scaleY(1); } 22%, 72% { transform: scaleY(.86); } 86%, 100% { transform: scaleY(1); } }
    @keyframes mbt-squint-bot { 0%, 10% { transform: scaleY(1); } 22%, 72% { transform: scaleY(.94); } 86%, 100% { transform: scaleY(1); } }
    /* pupil processing pulse, arc light breathes with it */
    @keyframes mbt-pupil {
      0%, 10% { transform: scale(1); }
      18% { transform: scale(.84); } 28% { transform: scale(1.06); }
      38% { transform: scale(.86); } 48% { transform: scale(1.06); }
      58% { transform: scale(.88); } 68% { transform: scale(1.04); }
      78%, 100% { transform: scale(1); }
    }
    @keyframes mbt-arc {
      0%, 10% { opacity: 1; }
      18% { opacity: .55; } 28% { opacity: 1; }
      38% { opacity: .55; } 48% { opacity: 1; }
      58% { opacity: .55; } 68% { opacity: 1; }
      78%, 100% { opacity: 1; }
    }
    @keyframes mbt-hl1 {
      0%, 10% { transform: scale(1); }
      18% { transform: scale(.88); } 28% { transform: scale(1); }
      38% { transform: scale(.88); } 48% { transform: scale(1); }
      58% { transform: scale(.88); } 68% { transform: scale(1); }
      78%, 100% { transform: scale(1); }
    }
    /* two natural blinks: fast close, slower open */
    @keyframes mbt-blink {
      0%, 50%  { transform: scaleY(1); animation-timing-function: ease-in; }
      51.8%    { transform: scaleY(.06); animation-timing-function: ease-out; }
      55.3%, 89% { transform: scaleY(1); animation-timing-function: ease-in; }
      90.6%    { transform: scaleY(.06); animation-timing-function: ease-out; }
      94%, 100% { transform: scaleY(1); }
    }

    /* ---------- Reduced motion: static canonical logo ---------- */
    @media (prefers-reduced-motion: reduce) {
      .mbt-blink, .mbt-gaze, .mbt-lid-top, .mbt-lid-bot, .mbt-pupil-g, .mbt-arc, .mbt-hlg, .mbt-hl1 { animation: none !important; }
    }
    .mboni-think[data-motion="off"] .mbt-blink,
    .mboni-think[data-motion="off"] .mbt-gaze,
    .mboni-think[data-motion="off"] .mbt-lid-top,
    .mboni-think[data-motion="off"] .mbt-lid-bot,
    .mboni-think[data-motion="off"] .mbt-pupil-g,
    .mboni-think[data-motion="off"] .mbt-arc,
    .mboni-think[data-motion="off"] .mbt-hlg,
    .mboni-think[data-motion="off"] .mbt-hl1 { animation: none !important; }
  </style>

  <defs>
    <!-- Canonical eye opening. IDs are prefixed; keep unique if inlining several copies. -->
    <clipPath id="mboni-th-open">
      <path d="M10 54 C54 7 182 2 230 46 C184 86 58 82 10 54 Z"/>
    </clipPath>
  </defs>

  <g class="mbt-blink">
    <g clip-path="url(#mboni-th-open)">
      <g class="mbt-gaze">
        <!-- iris -->
        <path class="mbt-iris" d="M94 46 a26 26 0 1 0 52 0 a26 26 0 1 0 -52 0 Z"/>
        <!-- limbal light arc -->
        <path class="mbt-arc" pathLength="100" d="M140.28 51.43 A21 21 0 0 1 114.57 66.28"/>
        <!-- pupil -->
        <g class="mbt-pupil-g">
          <path class="mbt-pupil" d="M109 46 a11 11 0 1 0 22 0 a11 11 0 1 0 -22 0 Z"/>
        </g>
        <!-- highlights -->
        <g class="mbt-hlg">
          <g class="mbt-hl1"><path class="mbt-hl" d="M106.8 38 a4.2 4.2 0 1 0 8.4 0 a4.2 4.2 0 1 0 -8.4 0 Z"/></g>
          <g><path class="mbt-hl" d="M125.3 55 a1.7 1.7 0 1 0 3.4 0 a1.7 1.7 0 1 0 -3.4 0 Z"/></g>
        </g>
      </g>
    </g>
    <!-- upper lid -->
    <path class="mbt-lid mbt-lid-top" d="M10 54 C54 -4 182 -8 230 46 C182 2 54 7 10 54 Z"/>
    <!-- lower lid -->
    <path class="mbt-lid mbt-lid-bot" d="M10 54 C58 88 184 92 230 46 C184 86 58 82 10 54 Z"/>
  </g>
</svg>
