<svg xmlns="http://www.w3.org/2000/svg" class="mboni mboni-scan" viewBox="0 0 240 88" width="240" height="88" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mboni-sc-title" data-theme="auto">
  <title id="mboni-sc-title">Mboni scanning</title>
  <style>
    .mboni-scan{--mb-dur:var(--mboni-dur,4.8s);--mb-delay:var(--mboni-delay,0s);--mb-count:var(--mboni-count,infinite);--mb-lid:var(--mboni-lid,#0B5D3B);--mb-iris:var(--mboni-iris,#0F8A5F);--mb-pupil:var(--mboni-pupil,#052E1F);--mb-arc:var(--mboni-arc,#A7F3D0);--mb-hl:var(--mboni-hl,#F0FFF7);}
    @media (prefers-color-scheme:dark){.mboni-scan{--mb-lid:var(--mboni-lid,#34D399);--mb-iris:var(--mboni-iris,#10B981);--mb-pupil:var(--mboni-pupil,#022C22);--mb-arc:var(--mboni-arc,#D9F99D);--mb-hl:var(--mboni-hl,#ECFDF5);}}
    .mboni-scan[data-theme="light"]{--mb-lid:var(--mboni-lid,#0B5D3B);--mb-iris:var(--mboni-iris,#0F8A5F);--mb-pupil:var(--mboni-pupil,#052E1F);--mb-arc:var(--mboni-arc,#A7F3D0);--mb-hl:var(--mboni-hl,#F0FFF7);}
    .mboni-scan[data-theme="dark"]{--mb-lid:var(--mboni-lid,#34D399);--mb-iris:var(--mboni-iris,#10B981);--mb-pupil:var(--mboni-pupil,#022C22);--mb-arc:var(--mboni-arc,#D9F99D);--mb-hl:var(--mboni-hl,#ECFDF5);}
    .mbn-lid{fill:var(--mb-lid)}.mbn-iris{fill:var(--mb-iris)}.mbn-pupil{fill:var(--mb-pupil)}.mbn-hl{fill:var(--mb-hl)}
    .mbn-arc{fill:none;stroke:var(--mb-arc);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:100 100;stroke-dashoffset:0}
    .mbn-blink,.mbn-squash,.mbn-lid-top,.mbn-lid-bot{transform-box:view-box;transform-origin:120px 50px}
    .mbn-zoom,.mbn-pupil-g{transform-box:view-box;transform-origin:120px 46px}
    .mbn-hl1{transform-box:view-box;transform-origin:111px 38px}
    .mbn-hl2{transform-box:view-box;transform-origin:127px 55px}
    .mbn-blink,.mbn-squash,.mbn-gaze,.mbn-zoom,.mbn-pupil-g,.mbn-arc,.mbn-hlg,.mbn-hl1,.mbn-hl2,.mbn-lid-top,.mbn-lid-bot{animation-duration:var(--mb-dur);animation-delay:var(--mb-delay);animation-iteration-count:var(--mb-count);animation-fill-mode:both;animation-timing-function:cubic-bezier(.4,0,.2,1)}
    .mbn-blink{animation-name:mbn-blink}
    .mbn-gaze{animation-name:mbn-gaze}
    .mbn-hlg{animation-name:mbn-hlg}
    .mbn-lid-top{animation-name:mbn-top}
    .mbn-lid-bot{animation-name:mbn-bot}
    .mbn-pupil-g{animation-name:mbn-pupil}
    .mbn-arc{animation-name:mbn-arc}
    @keyframes mbn-gaze{0%{transform:translate(0,0)}15%,21%{transform:translate(-13px,-1px)}50%,56%{transform:translate(13px,-1px)}85%,100%{transform:translate(0,0)}}
    @keyframes mbn-hlg{0%{transform:translate(0,0)}15%,21%{transform:translate(3.9px,.3px)}50%,56%{transform:translate(-3.9px,.3px)}85%,100%{transform:translate(0,0)}}
    @keyframes mbn-top{0%{transform:scaleY(1)}12%,88%{transform:scaleY(.92)}100%{transform:scaleY(1)}}
    @keyframes mbn-bot{0%{transform:scaleY(1)}12%,88%{transform:scaleY(.97)}100%{transform:scaleY(1)}}
    @keyframes mbn-pupil{0%{transform:scale(1)}12%,88%{transform:scale(.93)}100%{transform:scale(1)}}
    @keyframes mbn-arc{0%{opacity:1}12%,88%{opacity:.8}100%{opacity:1}}
    @keyframes mbn-blink{0%,91%{transform:scaleY(1);animation-timing-function:ease-in}92.6%{transform:scaleY(.06);animation-timing-function:ease-out}96%,100%{transform:scaleY(1)}}
    @media (prefers-reduced-motion:reduce){.mboni-scan *{animation:none!important}}
    .mboni-scan[data-motion="off"] *{animation:none!important}
  </style>
  <defs>
    <!-- Canonical eye opening (identical in every Mboni asset) -->
    <clipPath id="mboni-sc-open"><path d="M10 54 C54 7 182 2 230 46 C184 86 58 82 10 54 Z"/></clipPath>
  </defs>
  <g class="mbn-blink">
    <g clip-path="url(#mboni-sc-open)">
      <g class="mbn-squash"><g class="mbn-gaze"><g class="mbn-zoom">
        <!-- iris -->
        <path class="mbn-iris" d="M94 46 a26 26 0 1 0 52 0 a26 26 0 1 0 -52 0 Z"/>
        <!-- limbal light arc -->
        <path class="mbn-arc" pathLength="100" d="M140.28 51.43 A21 21 0 0 1 114.57 66.28"/>
        <!-- pupil -->
        <g class="mbn-pupil-g"><path class="mbn-pupil" d="M109 46 a11 11 0 1 0 22 0 a11 11 0 1 0 -22 0 Z"/></g>
        <!-- highlights -->
        <g class="mbn-hlg">
          <g class="mbn-hl1"><path class="mbn-hl" d="M106.8 38 a4.2 4.2 0 1 0 8.4 0 a4.2 4.2 0 1 0 -8.4 0 Z"/></g>
          <g class="mbn-hl2"><path class="mbn-hl" d="M125.3 55 a1.7 1.7 0 1 0 3.4 0 a1.7 1.7 0 1 0 -3.4 0 Z"/></g>
        </g>
      </g></g></g>
    </g>
    <!-- upper lid -->
    <path class="mbn-lid mbn-lid-top" d="M10 54 C54 -4 182 -8 230 46 C182 2 54 7 10 54 Z"/>
    <!-- lower lid -->
    <path class="mbn-lid mbn-lid-bot" d="M10 54 C58 88 184 92 230 46 C184 86 58 82 10 54 Z"/>
  </g>
</svg>
