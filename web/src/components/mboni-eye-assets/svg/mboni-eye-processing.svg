<svg xmlns="http://www.w3.org/2000/svg" class="mboni mboni-process" viewBox="0 0 240 88" width="240" height="88" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mboni-pr-title" data-theme="auto">
  <title id="mboni-pr-title">Mboni processing</title>
  <style>
    .mboni-process{--mb-dur:var(--mboni-dur,3.2s);--mb-delay:var(--mboni-delay,0s);--mb-count:var(--mboni-count,infinite);--mb-enter:var(--mboni-enter,.6s);--mb-lid:var(--mboni-lid,#0B5D3B);--mb-iris:var(--mboni-iris,#0F8A5F);--mb-pupil:var(--mboni-pupil,#052E1F);--mb-arc:var(--mboni-arc,#A7F3D0);--mb-hl:var(--mboni-hl,#F0FFF7);}
    @media (prefers-color-scheme:dark){.mboni-process{--mb-lid:var(--mboni-lid,#34D399);--mb-iris:var(--mboni-iris,#10B981);--mb-pupil:var(--mboni-pupil,#022C22);--mb-arc:var(--mboni-arc,#D9F99D);--mb-hl:var(--mboni-hl,#ECFDF5);}}
    .mboni-process[data-theme="light"]{--mb-lid:var(--mboni-lid,#0B5D3B);--mb-iris:var(--mboni-iris,#0F8A5F);--mb-pupil:var(--mboni-pupil,#052E1F);--mb-arc:var(--mboni-arc,#A7F3D0);--mb-hl:var(--mboni-hl,#F0FFF7);}
    .mboni-process[data-theme="dark"]{--mb-lid:var(--mboni-lid,#34D399);--mb-iris:var(--mboni-iris,#10B981);--mb-pupil:var(--mboni-pupil,#022C22);--mb-arc:var(--mboni-arc,#D9F99D);--mb-hl:var(--mboni-hl,#ECFDF5);}
    .mbp-lid{fill:var(--mb-lid)}.mbp-iris{fill:var(--mb-iris)}.mbp-pupil{fill:var(--mb-pupil)}.mbp-hl{fill:var(--mb-hl)}
    .mbp-arc{fill:none;stroke:var(--mb-arc);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:100 100;stroke-dashoffset:0}
    .mbp-blink,.mbp-squash,.mbp-lid-top,.mbp-lid-bot{transform-box:view-box;transform-origin:120px 50px}
    .mbp-zoom,.mbp-pupil-g{transform-box:view-box;transform-origin:120px 46px}
    .mbp-hl1{transform-box:view-box;transform-origin:111px 38px}
    .mbp-hl2{transform-box:view-box;transform-origin:127px 55px}
    .mbp-lid-top{animation:mbp-top-in var(--mb-enter) cubic-bezier(.3,.7,.3,1) var(--mb-delay) 1 forwards}
    .mbp-lid-bot{animation:mbp-bot-in var(--mb-enter) cubic-bezier(.3,.7,.3,1) var(--mb-delay) 1 forwards}
    .mbp-pupil-g{animation:mbp-pupil-in var(--mb-enter) ease-out var(--mb-delay) 1 forwards,mbp-pupil var(--mb-dur) ease-in-out calc(var(--mb-delay) + var(--mb-enter)) var(--mb-count) forwards}
    .mbp-arc{animation:mbp-arc var(--mb-dur) ease-in-out var(--mb-delay) var(--mb-count) both}
    .mbp-gaze{animation:mbp-gaze var(--mb-dur) ease-in-out var(--mb-delay) var(--mb-count) both}
    .mbp-hl1{animation:mbp-hl1 var(--mb-dur) ease-in-out var(--mb-delay) var(--mb-count) both}
    @keyframes mbp-top-in{from{transform:scaleY(1)}to{transform:scaleY(.88)}}
    @keyframes mbp-bot-in{from{transform:scaleY(1)}to{transform:scaleY(.95)}}
    @keyframes mbp-pupil-in{from{transform:scale(1)}to{transform:scale(.94)}}
    @keyframes mbp-pupil{0%,100%{transform:scale(.94)}50%{transform:scale(.97)}}
    @keyframes mbp-arc{0%,100%{opacity:1}50%{opacity:.72}}
    @keyframes mbp-gaze{0%,100%{transform:translate(0,0)}20%,24%{transform:translate(.8px,-.4px)}50%,54%{transform:translate(-.7px,.3px)}78%{transform:translate(.3px,.5px)}}
    @keyframes mbp-hl1{0%,100%{transform:scale(1)}50%{transform:scale(.92)}}
    @media (prefers-reduced-motion:reduce){.mboni-process *{animation:none!important}}
    .mboni-process[data-motion="off"] *{animation:none!important}
  </style>
  <defs>
    <!-- Canonical eye opening (identical in every Mboni asset) -->
    <clipPath id="mboni-pr-open"><path d="M10 54 C54 7 182 2 230 46 C184 86 58 82 10 54 Z"/></clipPath>
  </defs>
  <g class="mbp-blink">
    <g clip-path="url(#mboni-pr-open)">
      <g class="mbp-squash"><g class="mbp-gaze"><g class="mbp-zoom">
        <!-- iris -->
        <path class="mbp-iris" d="M94 46 a26 26 0 1 0 52 0 a26 26 0 1 0 -52 0 Z"/>
        <!-- limbal light arc -->
        <path class="mbp-arc" pathLength="100" d="M140.28 51.43 A21 21 0 0 1 114.57 66.28"/>
        <!-- pupil -->
        <g class="mbp-pupil-g"><path class="mbp-pupil" d="M109 46 a11 11 0 1 0 22 0 a11 11 0 1 0 -22 0 Z"/></g>
        <!-- highlights -->
        <g class="mbp-hlg">
          <g class="mbp-hl1"><path class="mbp-hl" d="M106.8 38 a4.2 4.2 0 1 0 8.4 0 a4.2 4.2 0 1 0 -8.4 0 Z"/></g>
          <g class="mbp-hl2"><path class="mbp-hl" d="M125.3 55 a1.7 1.7 0 1 0 3.4 0 a1.7 1.7 0 1 0 -3.4 0 Z"/></g>
        </g>
      </g></g></g>
    </g>
    <!-- upper lid -->
    <path class="mbp-lid mbp-lid-top" d="M10 54 C54 -4 182 -8 230 46 C182 2 54 7 10 54 Z"/>
    <!-- lower lid -->
    <path class="mbp-lid mbp-lid-bot" d="M10 54 C58 88 184 92 230 46 C184 86 58 82 10 54 Z"/>
  </g>
</svg>
