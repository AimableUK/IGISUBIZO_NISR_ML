<svg xmlns="http://www.w3.org/2000/svg" class="mboni mboni-activate" viewBox="0 0 240 88" width="240" height="88" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mboni-ac-title" data-theme="auto">
  <title id="mboni-ac-title">Mboni activating</title>
  <style>
    .mboni-activate{--mb-dur:var(--mboni-dur,2.4s);--mb-delay:var(--mboni-delay,0s);--mb-count:var(--mboni-count,1);--mb-lid:var(--mboni-lid,#0B5D3B);--mb-iris:var(--mboni-iris,#0F8A5F);--mb-pupil:var(--mboni-pupil,#052E1F);--mb-arc:var(--mboni-arc,#A7F3D0);--mb-hl:var(--mboni-hl,#F0FFF7);}
    @media (prefers-color-scheme:dark){.mboni-activate{--mb-lid:var(--mboni-lid,#34D399);--mb-iris:var(--mboni-iris,#10B981);--mb-pupil:var(--mboni-pupil,#022C22);--mb-arc:var(--mboni-arc,#D9F99D);--mb-hl:var(--mboni-hl,#ECFDF5);}}
    .mboni-activate[data-theme="light"]{--mb-lid:var(--mboni-lid,#0B5D3B);--mb-iris:var(--mboni-iris,#0F8A5F);--mb-pupil:var(--mboni-pupil,#052E1F);--mb-arc:var(--mboni-arc,#A7F3D0);--mb-hl:var(--mboni-hl,#F0FFF7);}
    .mboni-activate[data-theme="dark"]{--mb-lid:var(--mboni-lid,#34D399);--mb-iris:var(--mboni-iris,#10B981);--mb-pupil:var(--mboni-pupil,#022C22);--mb-arc:var(--mboni-arc,#D9F99D);--mb-hl:var(--mboni-hl,#ECFDF5);}
    .mba-lid{fill:var(--mb-lid)}.mba-iris{fill:var(--mb-iris)}.mba-pupil{fill:var(--mb-pupil)}.mba-hl{fill:var(--mb-hl)}
    .mba-arc{fill:none;stroke:var(--mb-arc);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:100 100;stroke-dashoffset:0}
    .mba-blink,.mba-squash,.mba-lid-top,.mba-lid-bot{transform-box:view-box;transform-origin:120px 50px}
    .mba-zoom,.mba-pupil-g{transform-box:view-box;transform-origin:120px 46px}
    .mba-hl1{transform-box:view-box;transform-origin:111px 38px}
    .mba-hl2{transform-box:view-box;transform-origin:127px 55px}
    .mba-blink,.mba-squash,.mba-gaze,.mba-zoom,.mba-pupil-g,.mba-arc,.mba-hlg,.mba-hl1,.mba-hl2,.mba-lid-top,.mba-lid-bot{animation-duration:var(--mb-dur);animation-delay:var(--mb-delay);animation-iteration-count:var(--mb-count);animation-fill-mode:both;animation-timing-function:cubic-bezier(.4,0,.2,1)}
    .mba-blink{animation-name:mba-blink}
    .mba-squash{animation-name:mba-squash}
    .mba-gaze{animation-name:mba-gaze}
    .mba-lid-top{animation-name:mba-top}
    .mba-lid-bot{animation-name:mba-bot}
    .mba-pupil-g{animation-name:mba-pupil;animation-timing-function:cubic-bezier(.3,.7,.3,1)}
    .mba-hl1{animation-name:mba-hl1;animation-timing-function:cubic-bezier(.3,.7,.3,1)}
    .mba-hl2{animation-name:mba-hl2;animation-timing-function:cubic-bezier(.3,.7,.3,1)}
    .mba-arc{animation-name:mba-arc;animation-timing-function:ease-in-out}
    @keyframes mba-top{0%{transform:scaleY(.04);opacity:0}8%{transform:scaleY(.04);opacity:1}46%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:1}}
    @keyframes mba-bot{0%{transform:scaleY(.04);opacity:0}12%{transform:scaleY(.04);opacity:1}52%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:1}}
    @keyframes mba-squash{0%,16%{transform:scaleY(.04);opacity:0}22%{opacity:1}56%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:1}}
    @keyframes mba-gaze{0%,24%{transform:translate(3px,5px)}62%,100%{transform:translate(0,0)}}
    @keyframes mba-pupil{0%,28%{transform:scale(.5)}58%{transform:scale(1.1)}74%,100%{transform:scale(1)}}
    @keyframes mba-hl1{0%,54%{transform:scale(0)}64%{transform:scale(1.18)}72%,100%{transform:scale(1)}}
    @keyframes mba-hl2{0%,60%{transform:scale(0)}70%{transform:scale(1.18)}78%,100%{transform:scale(1)}}
    @keyframes mba-arc{0%,56%{stroke-dashoffset:100;opacity:0}57%{stroke-dashoffset:100;opacity:1}80%,100%{stroke-dashoffset:0;opacity:1}}
    @keyframes mba-blink{0%,84%{transform:scaleY(1);animation-timing-function:ease-in}85.8%{transform:scaleY(.06);animation-timing-function:ease-out}89.3%,100%{transform:scaleY(1)}}
    @media (prefers-reduced-motion:reduce){.mboni-activate *{animation:none!important}}
    .mboni-activate[data-motion="off"] *{animation:none!important}
  </style>
  <defs>
    <!-- Canonical eye opening (identical in every Mboni asset) -->
    <clipPath id="mboni-ac-open"><path d="M10 54 C54 7 182 2 230 46 C184 86 58 82 10 54 Z"/></clipPath>
  </defs>
  <g class="mba-blink">
    <g clip-path="url(#mboni-ac-open)">
      <g class="mba-squash"><g class="mba-gaze"><g class="mba-zoom">
        <!-- iris -->
        <path class="mba-iris" d="M94 46 a26 26 0 1 0 52 0 a26 26 0 1 0 -52 0 Z"/>
        <!-- limbal light arc -->
        <path class="mba-arc" pathLength="100" d="M140.28 51.43 A21 21 0 0 1 114.57 66.28"/>
        <!-- pupil -->
        <g class="mba-pupil-g"><path class="mba-pupil" d="M109 46 a11 11 0 1 0 22 0 a11 11 0 1 0 -22 0 Z"/></g>
        <!-- highlights -->
        <g class="mba-hlg">
          <g class="mba-hl1"><path class="mba-hl" d="M106.8 38 a4.2 4.2 0 1 0 8.4 0 a4.2 4.2 0 1 0 -8.4 0 Z"/></g>
          <g class="mba-hl2"><path class="mba-hl" d="M125.3 55 a1.7 1.7 0 1 0 3.4 0 a1.7 1.7 0 1 0 -3.4 0 Z"/></g>
        </g>
      </g></g></g>
    </g>
    <!-- upper lid -->
    <path class="mba-lid mba-lid-top" d="M10 54 C54 -4 182 -8 230 46 C182 2 54 7 10 54 Z"/>
    <!-- lower lid -->
    <path class="mba-lid mba-lid-bot" d="M10 54 C58 88 184 92 230 46 C184 86 58 82 10 54 Z"/>
  </g>
</svg>
