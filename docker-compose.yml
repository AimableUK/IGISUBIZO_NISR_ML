# Development: hot reload for API (nodemon) and web (next dev).   docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: isesengura, POSTGRES_PASSWORD: isesengura, POSTGRES_DB: isesengura }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U isesengura"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  api:
    build: { context: ./api, dockerfile: Dockerfile.dev }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://isesengura:isesengura@postgres:5432/isesengura
      REDIS_URL: redis://redis:6379
      API_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
    ports: ["4000:4000"]
    volumes: ["./api:/app", "/app/node_modules"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  web:
    build: { context: ./web, dockerfile: Dockerfile.dev }
    environment: { NEXT_PUBLIC_API_URL: "http://localhost:4000", NEXT_PUBLIC_CONTACT_EMAIL: "team@example.com", WATCHPACK_POLLING: "true" }
    ports: ["3000:3000"]
    volumes: ["./web:/app", "/app/node_modules", "/app/.next"]
    depends_on: [api]
volumes:
  pgdata:
